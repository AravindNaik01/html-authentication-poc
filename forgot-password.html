<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HTML Authentication POC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
</head>
<body class="fade-in">

    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark/Light Mode">
        <i class="bi bi-moon-stars-fill"></i>
    </button>

    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="auth-wrapper">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-exclamation-fill text-primary" style="font-size: 3rem;"></i>
                <h2 class="title-gradient mt-2">Forgot Password?</h2>
                <p class="text-muted">No worries, we'll send you reset instructions.</p>
            </div>

            <form action="reset-password.html" class="needs-validation" novalidate id="forgotPassForm">
                <div class="mb-4">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your registered email" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>

                <div class="d-grid mt-2 mb-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Reset Password <i class="bi bi-send-fill ms-1"></i>
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <a href="login.html" class="text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script>
        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = themeBtn.querySelector('i');
        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        }
        updateThemeIcon(document.documentElement.getAttribute('data-bs-theme'));
        themeBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        const form = document.getElementById('forgotPassForm');
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            } else {
                event.preventDefault(); 
                document.getElementById('spinnerOverlay').classList.add('active');
                setTimeout(() => {
                    // Simulated redirect to reset page
                    window.location.href = form.action;
                }, 1500);
            }
            form.classList.add('was-validated');
        }, false);
    </script>
</body>
</html>
