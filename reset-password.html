<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HTML Authentication POC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
    </script>
</head>
<body class="fade-in">

    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark/Light Mode">
        <i class="bi bi-moon-stars-fill"></i>
    </button>

    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="auth-wrapper">
        <div class="glass-card">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill text-primary" style="font-size: 3rem;"></i>
                <h2 class="title-gradient mt-2">Reset Password</h2>
                <p class="text-muted">Enter your new password below to reset across all devices.</p>
            </div>

            <form action="login.html" class="needs-validation" novalidate id="resetPassForm">
                <div class="mb-3">
                    <label for="new-password" class="form-label">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="new-password" name="new-password" placeholder="Enter new password" required minlength="8">
                        <span class="input-group-text toggle-password">
                            <i class="bi bi-eye-fill"></i>
                        </span>
                        <div class="invalid-feedback">Password must be at least 8 characters.</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-check-circle-fill"></i></span>
                        <input type="password" class="form-control" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required>
                        <span class="input-group-text toggle-password">
                            <i class="bi bi-eye-fill"></i>
                        </span>
                        <div class="invalid-feedback" id="confirmError">Passwords do not match.</div>
                    </div>
                </div>

                <div class="d-grid mt-2 mb-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Update Password <i class="bi bi-arrow-right-circle-fill ms-1"></i>
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                 <a href="login.html" class="text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Scripts -->
    <script>
        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = themeBtn.querySelector('i');
        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        }
        updateThemeIcon(document.documentElement.getAttribute('data-bs-theme'));
        themeBtn.addEventListener('click', () => {
            let newTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // Toggle Password
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('i');
                if(input.type === 'password') {
                    input.type = 'text';
                    icon.classList.replace('bi-eye-fill', 'bi-eye-slash-fill');
                } else {
                    input.type = 'password';
                    icon.classList.replace('bi-eye-slash-fill', 'bi-eye-fill');
                }
            });
        });

        const form = document.getElementById('resetPassForm');
        const passInput = document.getElementById('new-password');
        const confirmInput = document.getElementById('confirm-password');

        form.addEventListener('submit', function (event) {
            let isValid = form.checkValidity();
            if(passInput.value !== confirmInput.value) {
                confirmInput.setCustomValidity('Passwords do not match');
                isValid = false;
            } else {
                confirmInput.setCustomValidity('');
            }

            if (!isValid) {
                event.preventDefault();
                event.stopPropagation();
            } else {
                event.preventDefault(); 
                document.getElementById('spinnerOverlay').classList.add('active');
                setTimeout(() => {
                    window.location.href = form.action;
                }, 1500);
            }
            form.classList.add('was-validated');
        }, false);

        confirmInput.addEventListener('input', () => {
             if(passInput.value === confirmInput.value) {
                confirmInput.setCustomValidity('');
            } else {
                confirmInput.setCustomValidity('Passwords do not match');
            }
        });
    </script>
</body>
</html>
